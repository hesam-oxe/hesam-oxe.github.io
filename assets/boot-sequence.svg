tributeName="opacity" values="0;0;1;1" keyTimes="0;0.5980;0.6160;1" dur="10s" repeatCount="indefinite"/></g><g opacity="1"><text x="28" y="296" font-size="12" fill="#3f4b5c">[ 0.138002 ]</text><text x="132" y="296" font-size="12.3" fill="#4ADE80">n-body         200 bodies · energy drift 0.0000%</text><rect x="908" y="285" width="62" height="16" rx="3" fill="#4ADE80" opacity=".12"/><text x="939" y="296" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#4ADE80">OK</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6600;0.6780;1" dur="10s" repeatCount="indefinite"/></g><g opacity="1"><text x="28" y="318" font-size="12" fill="#3f4b5c">[ 0.140000 ]</text><text x="132" y="318" font-size="12.3" fill="#DC143C">mercy.service  not found</text><rect x="908" y="307" width="62" height="16" rx="3" fill="#FFB000" opacity=".12"/><text x="939" y="318" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#FFB000">SKIP</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7220;0.7400;1" dur="10s" repeatCount="indefinite"/></g><g opacity="1"><text x="28" y="340" font-size="12" fill="#3f4b5c">[ 0.142000 ]</text><text x="132" y="340" font-size="12.3" fill="#4ADE80">boot complete — all subsystems nominal</text><rect x="908" y="329" width="62" height="16" rx="3" fill="#4ADE80" opacity=".12"/><text x="939" y="340" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#4ADE80">DONE</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7840;0.8020;1" dur="10s" repeatCount="indefinite"/></g><rect x="28" y="351" width="9" height="14" fill="#4ADE80"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect><rect x="28" y="350" width="944" height="3" rx="1.5" fill="#111925"/><rect x="28" y="350" width="0" height="3" rx="1.5" fill="url(#gSpec)"><animate attributeName="width" values="0;944" dur="8.5s" repeatCount="indefinite"/></rect><r