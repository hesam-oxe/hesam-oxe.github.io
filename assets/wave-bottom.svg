="-0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="4.9s" begin="-0.3s" repeatCount="indefinite"/></circle><circle cx="98" cy="-8" r="0.9" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="8.3s" begin="-5.2s" repeatCount="indefinite"/><animate attributeName="cx" values="98;120" dur="8.3s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="8.3s" begin="-3.2s" repeatCount="indefinite"/></circle><circle cx="477" cy="-8" r="1.0" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="8.1s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="cx" values="477;465" dur="8.1s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="8.1s" begin="-5.4s" repeatCount="indefinite"/></circle><circle cx="814" cy="-8" r="0.8" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="5.5s" begin="-3.9s" repeatCount="indefinite"/><animate attributeName="cx" values="814;826" dur="5.5s" begin="-3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="5.5s" begin="-1.8s" repeatCount="indefinite"/></circle><circle cx="828" cy="-8" r="1.5" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="6.5s" begin="-3.5s" repeatCount="indefinite"/><animate attributeName="cx" values="828;815" dur="6.5s" begin="-3.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="6.5s" begin="-5.2s" repeatCount="indefinite"/></circle><circle cx="682" cy="-8" r="1.8" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="5.0s" begin="-4.2s" repeatCount="indefinite"/><animate attributeName="cx" values="682;660" dur="5.0s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="5.0s" begin="-1.1s" repeatCount="indefinite"/></circle><circle cx="18" cy="-8" r="1.6" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="7.2s" begin="-3.9s" repeatCount="indefinite"/><animate attributeName="cx" values="18;42" dur="7.2s" begin="-2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="7.2s" begin="-1.4s" repeatCount="indefinite"/></circle><circle cx="115" cy="-8" r="1.9" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="5.0s" begin="-3.0s" repeatCount="indefinite"/><animate attributeName="cx" values="115;93" dur="5.0s" begin="-2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="5.0s" begin="-0.2s" repeatCount="indefinite"/></circle><circle cx="622" cy="-8" r="1.0" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="3.8s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="cx" values="622;638" dur="3.8s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="3.8s" begin="-1.1s" repeatCount="indefinite"/></circle><circle cx="644" cy="-8" r="0.7" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="4.6s" begin="-1.3s" repeatCount="indefinite"/><animate attributeName="cx" values="644;653" dur="4.6s" begin="-2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="4.6s" begin="-0.9s" repeatCount="indefinite"/></circle><circle cx="838" cy="-8" r="1.1" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="7.6s" begin="-7.3s" repeatCount="indefinite"/><animate attributeName="cx" values="838;827" dur="7.6s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="7.6s" begin="-3.9s" repeatCount="indefinite"/></circle><circle cx="862" cy="-8" r="1.5" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="6.4s" begin="-3.1s" repeatCount="indefinite"/><animate attributeName="cx" values="862;852" dur="6.4s" begin="-1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="6.4s" begin="-2.6s" repeatCount="indefinite"/></circle><circle cx="547" cy="-8" r="0.8" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="8.2s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="cx" values="547;568" dur="8.2s" begin="-5.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="8.2s" begin="-0.6s" repeatCount="indefinite"/></circle><circle cx="442" cy="-8" r="2.0" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="6.7s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="cx" values="442;461" dur="6.7s" begin="-5.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="6.7s" begin="-1.9s" repeatCount="indefinite"/></circle><circle cx="533" cy="-8" r="1.0" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="7.6s" begin="-5.3s" repeatCount="indefinite"/><animate attributeName="cx" values="533;536" dur="7.6s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="7.6s" begin="-2.1s" repeatCount="indefinite"/></circle><circle cx="413" cy="-8" r="2.0" fill="#FF6B35" opacity="0"><animate attributeName="cy" values="-8;116" dur="3.9s" begin="-1.0s" repeatCount="indefinite"/><animate attributeName="cx" values="413;400" dur="3.9s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;.85;0" dur="3.9s" begin="-2.1s" repeatCount="indefinite"/></circle></g><rect x="0" y="107" width="1000" height="3" fill="url(#gSpec)"/></svg>