<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="'Cascadia Code','Fira Code',monospace"><title>conquered skyline sector 7</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="1" stop-color="#1A080D"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="200" rx="10" fill="url(#sky)" stroke="#DC143C" stroke-width="1.2"/>
  <circle cx="620" cy="40" r="18" fill="#DC143C" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0.5">
    <polygon points="200,180 240,40 280,180" fill="url(#beam)">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="500,180 540,40 580,180" fill="url(#beam)">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="6s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g fill="#0D0D15" stroke="#3a3a55" stroke-width="1">
    <rect x="40" y="90" width="70" height="90"/>
    <rect x="130" y="60" width="60" height="120"/>
    <rect x="210" y="100" width="80" height="80"/>
    <rect x="310" y="50" width="55" height="130"/>
    <rect x="385" y="95" width="90" height="85"/>
    <rect x="495" y="70" width="65" height="110"/>
    <rect x="580" y="105" width="75" height="75"/>
    <rect x="670" y="80" width="50" height="100"/>
  </g>
  <g fill="#FFB000" opacity="0.9">
    <rect x="50" y="100" width="8" height="8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="140" y="75" width="8" height="8" fill="#DC143C"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="320" y="65" width="8" height="8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="505" y="85" width="8" height="8" fill="#00E5FF"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="590" y="115" width="8" height="8"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#8a8aa0" opacity="0.6">
    <circle cx="150" cy="60" r="4">
      <animate attributeName="cy" values="60;-10" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="50" r="5">
      <animate attributeName="cy" values="50;-10" begin="2s" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" begin="2s" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="55" r="3.5">
      <animate attributeName="cy" values="55;-10" begin="4s" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" begin="4s" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0" y="180" width="760" height="20" fill="#0A0A10"/>
  <text x="380" y="194" text-anchor="middle" font-size="11" letter-spacing="3" fill="#DC143C">SECTOR 7 — CONQUERED · SMOKE STILL RISING</text>
</svg>
