" values="0;1;1;0;0" keyTimes="0;0.1265;0.1647;0.1687;1" dur="5.0s" repeatCount="indefinite"/></text><text x="80.0" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="0">F<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1687;0.2069;0.2109;1" dur="5.0s" repeatCount="indefinite"/></text><text x="80.0" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="1">F<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2109;0.2309;0.9500;1" dur="5.0s" repeatCount="indefinite"/></text><text x="90.5" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="0">5<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0000;0.0487;0.0527;1" dur="5.0s" repeatCount="indefinite"/></text><text x="90.5" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="0">O<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0527;0.1014;0.1054;1" dur="5.0s" repeatCount="indefinite"/></text><text x="90.5" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="0">=<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1054;0.1541;0.1581;1" dur="5.0s" repeatCount="indefinite"/></text><text x="90.5" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="0">B<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1581;0.2069;0.2109;1" dur="5.0s" repeatCount="indefinite"/></text><text x="90.5" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="0">&gt;<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.2109;0.2596;0.2636;1" dur="5.0s" repeatCount="indefinite"/></text><text x="90.5" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="1">I<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2636;0.2836;0.9500;1" dur="5.0s" repeatCount="indefinite"/></text><text x="101.0" y="33" font-size="12.5" fill="#fff" font-weight="700" opacity="0">R<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0000;0.0593;0.0633;1" dur="5.0s" re