 values="512;694;512" dur="5.6s" repeatCount="indefinite"/></rect><text x="528" y="88" font-size="9.5" letter-spacing="1.7" fill="#7d8590">ORGANIZATIONS</text><text x="528" y="126" font-size="26" font-weight="700" fill="#FFB000" filter="url(#fGlowS)">25</text><circle cx="712" cy="108" r="20" fill="none" stroke="#131c28" stroke-width="4"/><circle cx="712" cy="108" r="20" fill="none" stroke="#FFB000" stroke-width="4" stroke-linecap="round" stroke-dasharray="94 999" stroke-dashoffset="94" transform="rotate(135 712 108)"><animate attributeName="stroke-dashoffset" values="94;0" dur="1.5s" begin="0.24s" fill="freeze"/></circle><text x="528" y="144" font-size="8.5" letter-spacing="1.2" fill="#3a4653">MEASURED</text><rect x="755" y="62" width="228" height="92" rx="8" fill="#080D14"/><rect x="755" y="62" width="228" height="92" rx="8" fill="url(#pFine)" opacity=".6"/><rect x="755" y="62" width="228" height="92" rx="8" fill="none" stroke="#4ADE80" stroke-opacity=".45"/><rect x="755" y="62" width="228" height="2.5" rx="1.2" fill="#4ADE80"/><rect x="755" y="62" width="46" height="2.5" rx="1.2" fill="#fff" opacity=".85"><animate attributeName="x" values="755;937;755" dur="6.1s" repeatCount="indefinite"/></rect><text x="771" y="88" font-size="9.5" letter-spacing="1.7" fill="#7d8590">OWASP MERGES</text><text x="771" y="126" font-size="26" font-weight="700" fill="#4ADE80" filter="url(#fGlowS)">7</text><circle cx="955" cy="108" r="20" fill="none" stroke="#131c28" stroke-width="4"/><circle cx="955" cy="108" r="20" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" stroke-dasharray="94 999" stroke-dashoffset="94" transform="rotate(135 955 108)"><animate attributeName="stroke-dashoffset" values="94;0" dur="1.5s" begin="0.36s" fill="freeze"/></circle><text x="771" y="144" font-size="8.5" letter-spacing="1.2" fill="#3a4653">MEASURED</text><rect x="26" y="170" width="228" height="92" rx="8" fill="#080D14"/><rect x="26" y="170" width="228" height="92" rx="8" fill="url(#pFine)" opacity=".6"/><rect x="26" y="170" width="228" height="92" rx="8" fill="none" stroke="#00E5FF" stroke-opacity=".45"/><rect x="26" y="170" width="228" height="2.5" rx="1.2" fill="#00E5FF"/><rect x="26" y="170" width="46" height="2.5" rx="1.2" fill="#fff" opacity=".85"><animate attributeName="x" values="26;208;26" dur="6.6s" repeatCount="indefinite"/></rect><text x="42" y="196" font-size="9.5" letter-spacing="1.7" fill="#7d8590">WASM BYTES</text><text x="42" y="234" font-size="26" font-weight="700" fill="#00E5FF" filter="url(#fGlowS)">253</text><circle cx="226" cy="216" r="20" fill="none" stroke="#131c28" stroke-width="4"/><circle cx="226" cy="216" r="20" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="94 999" stroke-dashoffset="94" transform="rotate(135 226 216)"><animate attributeName="stroke-dashoffset" values="94;0" dur="1.5s" begin="0.48s" fill="freeze"/></circle><text x="42" y="252" font-size="8.5" letter-spacing="1.2" fill="#3a4653">MEASURED</text><rect x="269" y="170" width="228" height="92" rx="8" fill="#080D14"/><rect x="269" y="170" width="228" height="92" rx="8" fill="url(#pFine)" opacity=".6"/><rect x="269" y="170" width="228" height="92" rx="8" fill="none" stroke="#B026FF" stroke-opacity=".45"/><rect x="269" y="170" width="228" height="2.5" rx="1.2" fill="#B026FF"/><rect x="269" y="170" width="46" height="2.5" rx="1.2" fill="#fff" opacity=".85"><animate attributeName="x" values="269;451;269" dur="7.1s" repeatCount="indefinite"/></rect><text x="285" y="196" font-size="9.5" letter-spacing="1.7" fill="#7d8590">VM STEPS</text><text x="285" y="234" font-size="19" font-weight="700" fill="#B026FF" filter="url(#fGlowS)">218,913</text><circle cx="469" cy="216" r="20" fill="none" stroke="#131c28" stroke-width="4"/><circle cx="469" cy="216" r="20" fill="none" stroke="#B026FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="94 999" stroke-dashoffset="94" transform="rotate(135 469 216)"><animate attributeName="stroke-dashoffset" values="94;0" dur="1.5s" begin="0.6s" fill="freeze"/></circle><text x="285" y="252" font-size="8.5" letter-spacing="1.2" fill="#3a4653">MEASURED</text><rect x="512" y="170" width="228" height="92" rx="8" fill="#080D14"/><rect x="512" y="170" width="228" height="92" rx="8" fill="url(#pFine)" opacity=".6"/><rect x="512" y="170" width="228" height="92" rx="8" fill="none" stroke="#4ADE80" stroke-opacity=".45"/><rect x="512" y="170" width="228" height="2.5" rx="1.2" fill="#4ADE80"/><rect x="512" y="170" width="46" height="2.5" rx="1.2" fill="#fff" opacity=".85"><animate attributeName="x" values="512;694;512" dur="7.6s" repeatCount="indefinite"/></rect><text x="528" y="196" font-size="9.5" letter-spacing="1.7" fill="#7d8590">NIST VECTORS</text><text x="528" y="234" font-size="26" font-weight="700" fill="#4ADE80" filter="url(#fGlowS)">PASS</text><circle cx="712" cy="216" r="20" fill="none" stroke="#131c28" stroke-width="4"/><circle cx="712" cy="216" r="20" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" stroke-dasharray="94 999" stroke-dashoffset="94" transform="rotate(135 712 216)"><animate attributeName="stroke-dashoffset" values="94;0" dur="1.5s" begin="0.72s" fill="freeze"/></circle><text x="528" y="252" font-size="8.5" letter-spacing="1.2" fill="#3a4653">MEASURED</text><rect x="755" y="170" width="228" height="92" rx="8" fill="#080D14"/><rect x="755" y="170" width="228" height="92" rx="8" fill="url(#pFine)" opacity=".6"/><rect x="755" y="170" width="228" height="92" rx="8" fill="none" stroke="#8b98a8" stroke-opacity=".45"/><rect x="755" y="170" width="228" height="2.5" rx="1.2" fill="#8b98a8"/><rect x="755" y="170" width="46" height="2.5" rx="1.2" fill="#fff" opacity=".85"><animate attributeName="x" values="755;937;755" dur="8.1s" repeatCount="indefinite"/></rect><text x="771" y="196" font-size="9.5" letter-spacing="1.7" fill="#7d8590">ENGINE DEPS</text><text x="771" y="234" font-size="26" font-weight="700" fill="#8b98a8" filter="url(#fGlowS)">0</text><circle cx="955" cy="216" r="20" fill="none" stroke="#131c28" stroke-width="4"/><circle cx="955" cy="216" r="20" fill="none" stroke="#8b98a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="94 999" stroke-dashoffset="94" transform="rotate(135 955 216)"><animate attributeName="stroke-dashoffset" values="94;94" dur="1.5s" begin="0.84s" fill="freeze"/></circle><text x="771" y="252" font-size="8.5" letter-spacing="1.2" fill="#3a4653">MEASURED</text><rect width="1000" height="290" rx="12" fill="url(#pScan)"/><rect x="-1000" y="0" width="550" height="290" fill="url(#gSheen)" transform="skewX(-18)"><animate attributeName="x" values="-600;1200" dur="12s" repeatCount="indefinite"/></rect></svg>